<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>DevSettings - Purple Studios</title>
    <style>
        body { font-family: sans-serif; background: #2a0052; color: white; padding: 20px; }
        .container { background: #3d0075; padding: 20px; border-radius: 10px; border: 2px solid #ffcc00; max-width: 600px; margin: auto; }
        input, select { padding: 10px; width: 90%; margin: 5px 0; border-radius: 5px; border: none; font-family: inherit; }
        .pedido-card { background: #4a008c; padding: 15px; margin: 10px 0; border-radius: 5px; border-left: 5px solid #ffcc00; position: relative; display: flex; justify-content: space-between; align-items: center; }
        .btn-verde { background: #32cd32; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-vermelho { background: #ff4444; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-preto { background: #111; color: #ff00ff; border: 1px solid #ff00ff; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-verde:active, .btn-vermelho:active, .btn-preto:active { transform: scale(0.95); }
        hr { border: 1px solid #5500aa; margin: 20px 0; }
        
        .img-comprovante { max-width: 100%; max-height: 250px; border-radius: 8px; border: 2px solid #ffcc00; margin-top: 10px; display: block; }
        .linha-dupla { display: flex; gap: 10px; width: 94%; }
        .linha-dupla input { width: 100%; }

        #tela-carregamento { text-align: center; margin-top: 50px; }
        .spinner { border: 4px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top: 4px solid #ffcc00; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="tela-carregamento">
        <div class="spinner"></div><h2>Verificando credenciais...</h2>
    </div>

    <div id="painel-admin" style="display: none;">
        <div class="container">
            <h1>⚙️ DevSettings</h1>
            <button onclick="window.location.href='index.html'" style="padding: 10px; width: 100%; font-weight: bold; cursor:pointer;">Voltar ao Site</button>
            <button onclick="window.sairAdmin()" class="btn-vermelho" style="width: 100%; margin-top: 5px;">Logout</button>
            
            <!-- NOVA SESSÃO: GERENCIAR LOJA VIP -->
            <hr>
            <h2>🛍️ Adicionar Produto - Loja VIP</h2>
            <input type="text" id="p-nome" placeholder="Nome do Produto (Ex: Arte Exclusiva)">
            <input type="text" id="p-valor" placeholder="Valor (Ex: Grátis, 10 Pontos)">
            <div class="linha-dupla">
                <input type="number" id="p-estoque" placeholder="Estoque (Ex: 20)">
                <input type="datetime-local" id="p-validade" title="Data/Hora que o item some da loja">
            </div>
            <button onclick="window.salvarProduto()" class="btn-verde" style="width: 100%; margin-top: 5px;">Adicionar à Loja</button>
            <div id="lista-produtos-dev" style="margin-top: 15px;">Carregando produtos...</div>

            <!-- RESTO DO PAINEL -->
            <hr>
            <h2>🔑 Código de Acesso da Loja VIP</h2>
            <input type="text" id="codigo-loja-atual" readonly style="background: #2a0052; color: #ffcc00; text-align: center; font-weight: bold;" value="Carregando...">
            <input type="text" id="novo-codigo-loja" placeholder="Novo código (Ex: PURPLE_VIP)">
            <button onclick="window.alterarCodigoLoja()" class="btn-verde" style="width: 100%; margin-top: 5px;">Mudar Código</button>

            <hr>
            <h2>📡 Atualizar Status</h2>
            <select id="select-meetup"><option value="">Carregando...</option></select>
            <input type="text" id="novo-status" placeholder="Ex: Galera, vou atrasar 10 minutinhos!">
            <button onclick="window.atualizarStatus()" class="btn-verde" style="width: 100%; margin-top:5px;">Atualizar Status</button>

            <hr>
            <h2>📦 Gerenciar Pedidos de Ingressos</h2>
            <div id="lista-pedidos">Carregando...</div>

            <hr>
            <h2>📅 Criar Novo Meetup</h2>
            <input type="text" id="m-nome" placeholder="Nome do Evento">
            <input type="number" id="m-preco" placeholder="Preço (Ex: 20)">
            <div class="linha-dupla">
                <input type="date" id="m-data"><input type="time" id="m-horario">
            </div>
            <input type="text" id="m-link" placeholder="Link (meet.google.com/...)">
            <button onclick="window.salvarMeetup()" class="btn-verde" style="width: 100%; margin-top: 5px;">Criar Meetup</button>
            
            <hr>
            <h2>🗑️ Gerenciar Meetups</h2>
            <div id="lista-gerenciar-meetups"></div>
        </div>
    </div>

    <!-- Modal Imagem mantida -->
    <div id="modalImagemFullscreen" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); justify-content:center; align-items:center; z-index: 9999; flex-direction:column;" onclick="window.fecharImagemFullscreen()">
        <span style="color:white; position:absolute; top:20px; right:30px; font-size:40px; font-weight:bold; cursor:pointer;">&times;</span>
        <img id="imagemAmpliada" style="max-width:95%; max-height:85%; border-radius:10px; border: 3px solid #7a28cb;">
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC-y0KtCLH0g65Q7nCb31avCx5G3iKekLc",
            authDomain: "purple-tickets.firebaseapp.com",
            projectId: "purple-tickets",
            storageBucket: "purple-tickets.firebasestorage.app",
            messagingSenderId: "808397510409",
            appId: "1:808397510409:web:cee298484e7f6db48da5d8"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('tela-carregamento').style.display = 'none';
                document.getElementById('painel-admin').style.display = 'block';
                window.carregarPedidos(); window.carregarMeetupsSelect(); window.carregarGerenciamentoMeetups(); window.carregarCodigoAtual(); window.carregarProdutosDev();
            } else { window.location.href = 'index.html'; }
        });

        window.sairAdmin = async function() { await signOut(auth); }

        // --- GESTÃO DA LOJA VIP ---
        window.salvarProduto = async function() {
            const nome = document.getElementById('p-nome').value;
            const valor = document.getElementById('p-valor').value;
            const estoque = parseInt(document.getElementById('p-estoque').value);
            const validade = document.getElementById('p-validade').value;

            if(!nome || !valor || isNaN(estoque) || !validade) return alert("Preencha Nome, Valor, Estoque e Validade!");

            await addDoc(collection(db, "produtosLoja"), { nome, valor, estoque, validade, dataCriacao: new Date().toISOString() });
            alert("Produto adicionado à Loja VIP!");
            
            document.getElementById('p-nome').value = ''; document.getElementById('p-valor').value = '';
            document.getElementById('p-estoque').value = ''; document.getElementById('p-validade').value = '';
            window.carregarProdutosDev();
        }

        window.carregarProdutosDev = async function() {
            const container = document.getElementById('lista-produtos-dev');
            const snap = await getDocs(collection(db, "produtosLoja"));
            container.innerHTML = "";
            snap.forEach(docSnap => {
                const d = docSnap.data();
                container.innerHTML += `
                    <div class="pedido-card" style="flex-direction: column; align-items: flex-start;">
                        <div><strong>${d.nome}</strong> - Valor: ${d.valor}</div>
                        <div style="font-size: 13px; color: #ffcc00;">Estoque: ${d.estoque} | Expira em: ${d.validade.replace('T', ' ')}</div>
                        <button onclick="window.deletarProduto('${docSnap.id}')" class="btn-vermelho" style="margin-top:8px;">🗑️ Remover Produto</button>
                    </div>
                `;
            });
        }

        window.deletarProduto = async function(id) {
            if(confirm("Apagar este produto da loja?")) {
                await deleteDoc(doc(db, "produtosLoja", id)); window.carregarProdutosDev();
            }
        }

        // --- OUTRAS FUNÇÕES DE ADMIN ---
        window.carregarCodigoAtual = async function() {
            const docSnap = await getDoc(doc(db, "lojaConfig", "acesso"));
            document.getElementById('codigo-loja-atual').value = docSnap.exists() ? "Código Atual: " + docSnap.data().codigo : "Nenhum código";
        }
        window.alterarCodigoLoja = async function() {
            const nc = document.getElementById('novo-codigo-loja').value.trim();
            if(!nc) return alert("Digite algo!");
            await setDoc(doc(db, "lojaConfig", "acesso"), { codigo: nc });
            alert("Código alterado!"); window.carregarCodigoAtual(); document.getElementById('novo-codigo-loja').value = '';
        }

        window.abrirImagemFullscreen = function(src) { document.getElementById('imagemAmpliada').src = src; document.getElementById('modalImagemFullscreen').style.display = 'flex'; }
        window.fecharImagemFullscreen = function() { document.getElementById('modalImagemFullscreen').style.display = 'none'; }

        // Mesmas funções de Meetup e Pedidos do código anterior (Resumidas para focar na Loja)
        window.carregarGerenciamentoMeetups = async function() {
            const container = document.getElementById('lista-gerenciar-meetups');
            const snap = await getDocs(collection(db, "meetups"));
            container.innerHTML = "";
            snap.forEach(d => {
                container.innerHTML += `<div class="pedido-card"><span>${d.data().nome}</span> <button onclick="window.deletarMeetup('${d.id}')" class="btn-vermelho">Apagar</button></div>`;
            });
        }
        window.deletarMeetup = async function(id) { if(confirm("Apagar?")) { await deleteDoc(doc(db, "meetups", id)); window.carregarGerenciamentoMeetups(); window.carregarMeetupsSelect(); } }

        window.carregarPedidos = async function() {
            const container = document.getElementById('lista-pedidos');
            const snap = await getDocs(collection(db, "pedidos"));
            container.innerHTML = "";
            snap.forEach((d) => {
                const dados = d.data();
                const email = dados.email || 'N/A';
                let imgTag = dados.comprovanteFoto ? `<img src="${dados.comprovanteFoto}" class="img-comprovante" onclick="window.abrirImagemFullscreen('${dados.comprovanteFoto}')">` : '<p>Sem imagem</p>';
                container.innerHTML += `
                    <div class="pedido-card" style="flex-direction: column; align-items: flex-start; width: 90%;">
                        <div><strong>Nome:</strong> ${dados.nome} | <strong>Email:</strong> ${email} | <strong>Status:</strong> ${dados.status}</div>
                        ${imgTag}
                        <div style="margin-top: 10px;">
                            <button onclick="window.aceitarPedido('${d.id}')" class="btn-verde">Aceitar</button>
                            <button onclick="window.recusarPedido('${d.id}')" class="btn-vermelho">Recusar</button>
                        </div>
                    </div>`;
            });
        }
        window.aceitarPedido = async function(id) { await updateDoc(doc(db, "pedidos", id), { status: "Aprovado" }); window.carregarPedidos(); }
        window.recusarPedido = async function(id) { await updateDoc(doc(db, "pedidos", id), { status: "Recusado" }); window.carregarPedidos(); }

        window.carregarMeetupsSelect = async function() {
            const select = document.getElementById('select-meetup');
            const snap = await getDocs(collection(db, "meetups"));
            select.innerHTML = '<option value="">Selecione...</option>';
            snap.forEach(d => select.innerHTML += `<option value="${d.id}">${d.data().nome}</option>`);
        }
        window.atualizarStatus = async function() {
            const id = document.getElementById('select-meetup').value;
            const msg = document.getElementById('novo-status').value;
            if(!id || !msg) return alert("Preencha tudo!");
            await updateDoc(doc(db, "meetups", id), { mensagemStatus: msg }); alert("Status atualizado!");
        }
        window.salvarMeetup = async function() {
            const nome = document.getElementById('m-nome').value; const preco = document.getElementById('m-preco').value;
            const data = document.getElementById('m-data').value; const horario = document.getElementById('m-horario').value;
            const linkMeet = document.getElementById('m-link').value;
            if(!nome || !linkMeet) return alert("Preencha!");
            await addDoc(collection(db, "meetups"), { nome, preco, data, horario, linkMeet, mensagemStatus: "Tudo certo!" });
            alert("Meetup criado!"); window.carregarMeetupsSelect(); window.carregarGerenciamentoMeetups();
        }
    </script>
</body>
</html>
